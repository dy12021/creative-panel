<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- SPEC 12：不做移动端适配，只保证桌面 1280px 以上。锁死布局宽度，
     免得窗口一小，五列被压扁。 -->
<meta name="viewport" content="width=1280">
<title>创意面板</title>
<!-- 空 data URI 当 favicon：省掉一次必然 404 的 /favicon.ico 请求 -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <h1>创意面板</h1>
    <input id="q" type="search" placeholder="搜索标题或描述" autocomplete="off" aria-label="搜索">
    <select id="tag" aria-label="标签筛选"><option value="">全部标签</option></select>
    <label class="toggle"><input id="only-blocked" type="checkbox"> 只看卡住的</label>
    <button id="new-btn" class="primary" type="button">＋ 记一个想法</button>
  </header>

  <main class="board" id="board"></main>

  <!-- 记一个想法：页面内的表单。
       原来是 window.prompt——浏览器自带的小灰框，样式不受控、只能填一个字段、
       一关就没了。换成 <dialog>：标题/描述/标签三个字段都在页面里，
       原生自带 Esc 关闭与焦点约束，不需要自己写。 -->
  <dialog class="composer" id="composer">
    <form class="composer-inner" id="composer-form" method="dialog">
      <h2 class="composer-title" id="composer-title">记一个想法</h2>
      <label class="field">
        <span>想法</span>
        <input id="c-title" required maxlength="200" placeholder="一句话说清这是什么" autocomplete="off">
      </label>
      <label class="field">
        <span>描述（可留空）</span>
        <textarea id="c-body" placeholder="为什么想做、给谁看、要什么效果"></textarea>
      </label>
      <label class="field">
        <span>标签（逗号分隔，可留空）</span>
        <input id="c-tags" placeholder="视频,叙事" autocomplete="off">
      </label>
      <div class="composer-actions">
        <button class="secondary" type="button" id="c-cancel">算了</button>
        <button class="primary" type="submit" id="c-save">记下来</button>
      </div>
    </form>
  </dialog>

  <!-- 抽屉：Task 7 填充内容。本任务只保证它开局是关着的。 -->
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-inner">
      <div class="drawer-bar">
        <button class="drawer-icon" id="drawer-full" type="button"
                aria-label="展开到全屏" title="展开到全屏">⤢</button>
        <button class="drawer-icon" id="drawer-close" type="button"
                aria-label="关闭" title="关闭（Esc）">✕</button>
      </div>
      <div id="drawer-body"></div>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
